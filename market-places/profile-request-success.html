<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Request Sent</title>
  <link rel="stylesheet" href="assets/brainfx-directory.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue) 62%,#4fa45f 140%);padding:24px}
    .success-card{width:min(560px,100%);background:#fff;border:1px solid rgba(255,255,255,.78);border-radius:26px;box-shadow:0 34px 90px rgba(10,14,46,.28);padding:28px;text-align:center}
    .success-card img{width:58px;height:58px;object-fit:contain;margin:0 auto 18px}
    .success-card h1{font-size:38px;margin-bottom:10px}
    .success-card p{color:var(--muted);line-height:1.7;margin-bottom:22px}
    .success-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
  <main class="success-card">
    <img src="assets/brainfx-mark-cropped.png" alt="BrainFX">
    <h1>Profile request sent</h1>
    <p>Thank you. The BrainFX team will review this submission and follow up with next steps.</p>
    <div class="success-actions">
      <a class="btn green" href="index.html">Back to marketplace</a>
      <a class="btn ghost" href="profiles.html">View profiles</a>
    </div>
  </main>
</body>
</html>
